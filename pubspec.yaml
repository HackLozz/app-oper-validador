name: almuerzos_colsubsidio_2
description: KYC facial offline con Flutter + MLKit + TFLite
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.2.3

  camera: ^0.11.0
  dart_jsonwebtoken: ^2.12.0

  google_mlkit_face_detection: ^0.12.0
  google_mlkit_barcode_scanning: ^0.13.0
  google_mlkit_text_recognition: ^0.14.0

  tflite_flutter: ^0.11.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  path_provider: ^2.1.4
  path: ^1.9.0
  image: ^4.2.0
  collection: ^1.18.0
  permission_handler: ^11.4.0
  audioplayers: ^6.6.0

  flutter_svg: ^2.0.10
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/models/mobilefacenet.tflite
    - assets/colsubsidio.svg
    - assets/sounds/
